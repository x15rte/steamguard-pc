name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to release. Must match pyproject.toml project.version."
        required: true
        type: string
      title:
        description: "Release title. Defaults to v<version>."
        required: false
        type: string
      prerelease:
        description: "Mark the release as a prerelease."
        required: true
        type: boolean
        default: false
      generate_notes:
        description: "Generate release notes from GitHub commits and pull requests."
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-v${{ inputs.version }}
  cancel-in-progress: false

jobs:
  full-tests:
    name: Full test suite
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install -e ".[dev]"

      - name: Run full test suite
        run: python -m pytest

  release:
    name: Build and publish GitHub release
    needs: full-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install build==1.5.0

      - name: Resolve release version
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          pyproject_version="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])')"
          if [[ "$RELEASE_VERSION" != "$pyproject_version" ]]; then
            echo "::error::Release version '$RELEASE_VERSION' must match pyproject.toml version '$pyproject_version'."
            exit 1
          fi
          echo "version=$pyproject_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$pyproject_version" >> "$GITHUB_OUTPUT"

      - name: Build distributions
        run: python -m build

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ inputs.title }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_GENERATE_NOTES: ${{ inputs.generate_notes }}
        shell: bash
        run: |
          title="$RELEASE_TITLE"
          if [[ -z "$title" ]]; then
            title="$RELEASE_TAG"
          fi

          flags=(--target "$GITHUB_SHA" --title "$title")
          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
            flags+=(--prerelease)
          fi
          if [[ "$RELEASE_GENERATE_NOTES" == "true" ]]; then
            flags+=(--generate-notes)
          else
            flags+=(--notes "Release $RELEASE_TAG")
          fi

          gh release create "$RELEASE_TAG" dist/* "${flags[@]}"
