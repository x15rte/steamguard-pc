[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "steamguard-pc"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "keyring>=25",
  "requests>=2.32",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "requests-mock>=1.12",
]

[project.scripts]
steamguard-pc = "steamguard_pc.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
