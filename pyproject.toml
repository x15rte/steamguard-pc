[build-system]
requires = ["setuptools>=83.0.0", "wheel>=0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "steamguard-pc"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "keyring>=25.7.0",
  "cryptography>=50.0.0",
  "requests>=2.34.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "pyright>=1.1.411",
  "requests-mock>=1.12.1",
]

[project.scripts]
steamguard-pc = "steamguard_pc.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["steamguard_pc", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
